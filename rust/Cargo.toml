[package]
name = "t32"
version = "0.2.0"
authors = ["Oddur Sigurdsson (@oddurs)"]
edition = "2021"
rust-version = "1.70"
description = "T32, a compact universal timestamp: atomic seconds in sortable base32, where a stamp's length is its resolution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oddurs/t32"
homepage = "https://oddurs.github.io/t32/"
documentation = "https://docs.rs/t32"
readme = "README.md"
keywords = ["time", "timestamp", "tai", "utc", "base32"]
categories = ["date-and-time", "encoding"]
include = ["src/**/*.rs", "tests/**/*.rs", "examples/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
## Serialize and deserialize every type with serde (see the crate docs, "Serde").
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.140", optional = true, default-features = false }

[dev-dependencies]
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde_json = "1"
serde_test = "1"

[package.metadata.docs.rs]
all-features = true
