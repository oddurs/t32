name: CI

# Runs on pull requests, and on main as the first stage of pages.yml and
# publish-crate.yml, so nothing ships from a commit that has not passed. CI
# knows only scripts/task, the same entry point the git hooks use, so the two
# cannot drift apart.
on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload the checked site build for pages.yml to deploy
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request supersedes the run in progress. Runs on main
# are never cancelled: each one gates a deploy or a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install tectonic (pinned, checksum verified)
        env:
          VERSION: 0.17.0
          SHA256: 8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tectonic.tar.gz" \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${VERSION}/tectonic-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # tectonic fetches the TeX packages the draft uses; keep them between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Tectonic
          key: tectonic-0.17.0-${{ hashFiles('ietf/*.tex') }}
          restore-keys: tectonic-0.17.0-
      # Built with the production base path, so the site checked here is the one deployed.
      - run: scripts/task check
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - if: inputs.upload-pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/build

  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.70 --profile minimal
      # The library's MSRV; the test suite's dev-dependencies need newer Rust.
      - run: cargo +1.70 check --lib
      - run: cargo +1.70 check --lib --all-features

  # The one status check branch protection requires. It runs even when a job it
  # needs fails or is skipped, so it can never pass by not running.
  required:
    if: always()
    needs: [check, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
