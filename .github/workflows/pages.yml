name: Deploy site

# Publishes web/ with actions/deploy-pages; the repository's Pages source
# must be "GitHub Actions". Only a commit that passed CI is deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Queue deploys rather than cancel them: an interrupted deploy can leave
# the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CI builds the site with the production base path and uploads that build,
  # so what deploys is exactly what was checked.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      upload-pages: true
    permissions:
      contents: read

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
