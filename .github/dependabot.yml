# Weekly updates, minor and patch versions grouped into one pull request per
# ecosystem. Majors arrive one at a time, so each can be read on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      # SvelteKit, its adapter, Vite and the Svelte plugin work only at matching
      # majors, so they move together, majors included.
      svelte:
        patterns: ["@sveltejs/*", "svelte", "svelte-check", "vite"]
      npm:
        update-types: [minor, patch]
    ignore:
      # svelte-check supports TypeScript 5 and 6; hold 7 until it does.
      - dependency-name: typescript
        versions: [">=7"]
